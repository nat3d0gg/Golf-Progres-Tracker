<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5D33">
<title>RangeLog — Golf Range &amp; Lesson Tracker</title>
<!-- Home-screen / PWA icons (same-origin static files served by Vercel) -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RangeLog">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="RangeLog">
<style>
  /* ============================================================
     RangeLog — single-file golf range & lesson tracker
     Design: "the interface is the course" — 1990s retro country
     club, rendered as soft rounded illustrated flat vector.
     Reskin only: markup hooks, data model and JS logic unchanged.
     ============================================================ */

  :root {
    /* Whites / creams */
    --white:       #FBFBF4;   /* clubhouse white */
    --ivory:       #F4F1E4;   /* scorecard ivory */
    /* Greens */
    --green:       #1F7A44;   /* putting green */
    --forest:      #0B5D33;   /* Augusta / structure */
    --fairway:     #4CAF50;   /* bright fairway */
    --lime:        #8BD450;   /* highlight */
    --rough:       #0A3D24;   /* deep rough */
    /* Accents (used sparingly) */
    --sand:        #E9D8A6;
    --water:       #2E86C1;
    --gold:        #C9A227;
    --flag:        #D64541;

    --ink:         #103524;
    --ink-soft:    #4B6B58;
    --ink-faint:   #7A9186;
    --line:        rgba(11,93,51,0.16);
    --line-soft:   rgba(11,93,51,0.10);

    --radius:      22px;
    --radius-sm:   16px;
    --tap:         46px;
    --nav-h:       68px;

    --shadow:      0 10px 26px rgba(11,93,51,0.14);
    --shadow-soft: 0 4px 12px rgba(11,93,51,0.09);

    --round: ui-rounded, "SF Pro Rounded", "Varela Round", "Quicksand",
             "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", "Courier New", monospace;
    font-size: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--white);
    /* soft mower-stripe fairway backdrop — gentle, keeps the page airy */
    background-image:
      repeating-linear-gradient(115deg,
        rgba(31,122,68,0.030) 0 46px,
        rgba(76,175,80,0.055) 46px 92px);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--round);
    line-height: 1.45;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.015em; color: var(--forest); }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 999px; }
  ::selection { background: rgba(139,212,80,0.45); }

  /* ---------- App shell / layout ---------- */
  .app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  /* ---- The clubhouse: top bar ---- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 14px 14px;
    position: sticky; top: 0; z-index: 30;
    background: var(--white);
    border-bottom: none;
    box-shadow: 0 3px 14px rgba(11,93,51,0.07);
  }
  /* rounded green awning along the clubhouse eaves */
  .topbar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px;
    background: repeating-linear-gradient(90deg,
      var(--forest) 0 24px, var(--white) 24px 48px);
  }
  .topbar::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 7px; height: 2px;
    background: var(--gold); opacity: 0.55;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .crest { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 2px 4px rgba(11,93,51,0.22)); }
  .brand h1 { font-size: 1.22rem; }
  .brand .tag {
    color: var(--ink-faint); font-size: 0.64rem; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase;
  }
  .topbar .spacer { flex: 1; }

  /* sync pill = a little flag. Flying when live, furled otherwise. */
  .sync {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: var(--ivory); border: 2px solid var(--line);
    font-size: 0.72rem; font-weight: 800; color: var(--ink-soft);
    white-space: nowrap; letter-spacing: 0.01em;
  }
  .sync-flag { width: 15px; height: 16px; flex: none; display: block; }
  .sync-flag .pennant { transform-origin: 3px 3px; }
  .sync[data-state="synced"] { background: rgba(76,175,80,0.14); border-color: rgba(31,122,68,0.35); color: var(--forest); }
  .sync[data-state="synced"] .pennant { animation: wave 2.6s ease-in-out infinite; }
  .sync[data-state="offline"] { background: rgba(214,69,65,0.10); border-color: rgba(214,69,65,0.35); color: #96322f; }
  .sync[data-state="offline"] .pennant { transform: scaleX(0.28); }
  .sync[data-state="saving"] { background: rgba(201,162,39,0.14); border-color: rgba(201,162,39,0.45); color: #7d6413; }
  .sync[data-state="saving"] .pennant,
  .sync[data-state="connecting"] .pennant { animation: wave 0.9s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  @media (max-width: 430px) { .sync .sync-text { display: none; } .sync { padding: 7px 9px; } }

  .icon-btn {
    height: var(--tap); min-width: var(--tap); padding: 0 12px;
    border-radius: 999px;
    background: var(--white); color: var(--forest);
    border: 2px solid var(--line);
    font-size: 0.78rem; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  .icon-btn:hover { background: rgba(76,175,80,0.10); }
  .icon-btn:active { background: rgba(31,122,68,0.16); transform: translateY(1px); }
  .icon-btn svg { width: 17px; height: 17px; flex: none; }
  @media (max-width: 560px) { .icon-btn .lbl { display: none; } .icon-btn { padding: 0 10px; } }

  .shell { display: flex; flex: 1; }
  .sidenav { display: none; }

  .main {
    flex: 1; width: 100%; max-width: 780px; margin: 0 auto;
    padding: 18px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px);
  }

  .view { animation: fade 0.22s cubic-bezier(.22,.9,.3,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* view heading: course name eyebrow over the functional title */
  .view-head { margin-bottom: 16px; }
  .view-head .eyebrow {
    display: inline-block; font-size: 0.66rem; font-weight: 900;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);
    margin-bottom: 3px;
  }
  .view-head h2 { font-size: 1.62rem; }
  .view-head .sub { color: var(--ink-soft); font-size: 0.9rem; margin-top: 2px; }

  /* ---------- Cards & sections ---------- */
  .card {
    background: var(--white);
    border: 2px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 17px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-soft);
  }
  .card.raised { box-shadow: var(--shadow); border-color: var(--line); }
  /* scorecard treatment — ivory paper with a forest header band */
  .card.scorecard { background: var(--ivory); border-color: var(--line); }
  .section-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.13em;
    color: var(--ink-faint); font-weight: 900; margin-bottom: 11px;
  }

  /* ---------- Buttons (pills) ---------- */
  .btn {
    height: var(--tap); padding: 0 20px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--white); color: var(--forest);
    font-size: 0.95rem; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: var(--shadow-soft);
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 4px rgba(11,93,51,0.12); }
  .btn.primary {
    background: linear-gradient(180deg, var(--green), var(--forest));
    color: var(--white); border-color: transparent;
    box-shadow: 0 6px 16px rgba(11,93,51,0.28);
  }
  .btn.primary:hover { background: linear-gradient(180deg, #24894d, #0d6a3a); }
  .btn.gold { background: var(--gold); color: #3B2E05; border-color: transparent; }
  .btn.ghost { background: var(--white); }
  .btn.ghost:hover { background: rgba(76,175,80,0.10); }
  .btn.danger { background: var(--white); color: #B23A36; border-color: rgba(214,69,65,0.38); }
  .btn.danger:hover { background: rgba(214,69,65,0.08); }
  .btn.block { width: 100%; }
  .btn.sm { height: 38px; padding: 0 14px; font-size: 0.84rem; }

  /* ---------- Chips (the bag) ---------- */
  .chip {
    min-height: var(--tap); padding: 0 17px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--white); color: var(--ink-soft);
    font-size: 0.93rem; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .chip:active { transform: scale(0.97); }
  .chip.on {
    background: linear-gradient(180deg, rgba(139,212,80,0.28), rgba(76,175,80,0.20));
    color: var(--forest); border-color: var(--green);
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip.sm { min-height: 38px; padding: 0 13px; font-size: 0.83rem; }

  /* ---------- Inputs ---------- */
  label.fld { display: block; margin-bottom: 13px; }
  label.fld > span { display: block; font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 6px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
  input[type=text], input[type=date], input[type=password], textarea, select {
    width: 100%; min-height: var(--tap);
    background: var(--white); color: var(--ink);
    border: 2px solid var(--line); border-radius: 999px;
    padding: 11px 17px; font-size: 1rem; font-family: inherit;
  }
  textarea { border-radius: var(--radius-sm); resize: vertical; min-height: 66px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(76,175,80,0.18); }
  ::placeholder { color: var(--ink-faint); }

  /* Date input — normalize iOS Safari, which otherwise centers the value
     and hides the picker affordance. Left-align to match other fields. */
  input[type=date] {
    -webkit-appearance: none; appearance: none;
    text-align: left; display: flex; align-items: center; line-height: 1.2;
  }
  input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type=date]::-webkit-calendar-picker-indicator {
    margin-left: auto; opacity: 0.55; cursor: pointer;
  }

  /* ---------- Club group mini panel ---------- */
  .group-block { margin-bottom: 10px; }
  .group-panel {
    margin-top: 9px; padding: 14px;
    background: var(--ivory);
    border: 2px dashed rgba(11,93,51,0.18);
    border-radius: var(--radius-sm);
    animation: unfurl 0.22s cubic-bezier(.22,.9,.3,1);
  }
  @keyframes unfurl { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .group-panel .lbl { font-size: 0.71rem; color: var(--ink-soft); font-weight: 800; margin-bottom: 8px; letter-spacing: 0.03em; }
  .contact-dots { display: flex; gap: 8px; margin-bottom: 14px; }
  /* contact 1–5 = a rounded power meter of dimpled balls */
  .dot {
    width: var(--tap); height: var(--tap); border-radius: 50%;
    border: 2px solid var(--line); background: var(--white);
    color: var(--ink-faint); font-weight: 700; font-size: 0.98rem;
    font-family: var(--mono);
    display: grid; place-items: center; position: relative;
    transition: transform 0.14s cubic-bezier(.3,1.4,.5,1), background 0.15s ease;
  }
  .dot::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    background-image: radial-gradient(rgba(11,93,51,0.10) 1.1px, transparent 1.5px);
    background-size: 8px 8px; pointer-events: none;
  }
  .dot.on {
    background: radial-gradient(circle at 35% 30%, var(--lime), var(--green) 78%);
    color: var(--white); border-color: var(--forest);
    box-shadow: 0 3px 9px rgba(11,93,51,0.28);
    transform: translateY(-2px);
  }
  .dot.on::after { background-image: radial-gradient(rgba(255,255,255,0.22) 1.1px, transparent 1.5px); }

  /* ---------- Homework checkboxes (pencil ticks) ---------- */
  .hw-item {
    display: flex; align-items: center; gap: 12px;
    min-height: var(--tap); padding: 9px 14px;
    border: 2px solid var(--line); border-radius: 999px;
    background: var(--white); margin-bottom: 9px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .hw-item.on { border-color: var(--green); background: rgba(139,212,80,0.16); }
  .hw-box {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    border: 2px solid var(--line); background: var(--ivory);
    display: grid; place-items: center;
  }
  .hw-item.on .hw-box { background: var(--green); border-color: var(--forest); }
  .hw-box svg { width: 17px; height: 17px; }
  .hw-box svg path {
    fill: none; stroke: var(--white); stroke-width: 3.4;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 26; stroke-dashoffset: 26;
  }
  .hw-item.on .hw-box svg path { animation: tick 0.34s cubic-bezier(.3,.9,.4,1) forwards; }
  @keyframes tick { to { stroke-dashoffset: 0; } }
  .hw-item .hw-name { font-weight: 700; }

  /* ---------- Sticky save bar ---------- */
  .savebar {
    position: fixed; left: 0; right: 0;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding: 14px 16px 14px;
    background: linear-gradient(180deg, rgba(251,251,244,0), var(--white) 42%);
    z-index: 25;
    max-width: 780px; margin: 0 auto;
  }
  .savebar .btn { height: 54px; font-size: 1.06rem; }

  /* ---------- Bottom tab nav = yardage posts ---------- */
  .tabnav {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding: 7px 8px env(safe-area-inset-bottom);
    display: flex; gap: 2px; z-index: 40;
    background: var(--forest);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -6px 20px rgba(10,61,36,0.22);
  }
  .tabnav button {
    flex: 1; background: none; border: none; color: rgba(251,251,244,0.72);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 0.66rem; font-weight: 800; padding: 5px 0;
    border-radius: 20px; letter-spacing: 0.02em;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .tabnav button .ic { display: block; width: 23px; height: 23px; }
  .tabnav button .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .tabnav button.active { background: var(--lime); color: var(--rough); }

  /* ---------- Lists / rows (stacked scorecards) ---------- */
  .row-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 15px; border-radius: var(--radius);
    background: var(--ivory); border: 2px solid var(--line);
    margin-bottom: 11px; box-shadow: var(--shadow-soft);
  }
  .row-item.active-lesson { border-color: var(--green); box-shadow: 0 0 0 3px rgba(139,212,80,0.28), var(--shadow-soft); }
  .row-item .grow { flex: 1; min-width: 0; }
  .row-item strong { color: var(--forest); font-size: 1.02rem; }
  .pill {
    display: inline-block; font-size: 0.63rem; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.09em;
    padding: 4px 10px; border-radius: 999px;
    background: var(--green); color: var(--white);
  }
  .pill.grey { background: var(--sand); color: #6B5A1F; }
  .meta { color: var(--ink-soft); font-size: 0.84rem; }
  .drill-tag {
    display: inline-block; font-size: 0.78rem; font-weight: 700;
    padding: 5px 12px; border-radius: 999px; margin: 3px 4px 0 0;
    background: var(--white); color: var(--ink-soft); border: 2px solid var(--line-soft);
  }

  /* ---------- Segmented control (Log: New / History) ---------- */
  .seg {
    display: flex; gap: 4px; margin-bottom: 15px;
    background: var(--ivory); border: 2px solid var(--line-soft);
    border-radius: 999px; padding: 5px;
  }
  .seg button {
    flex: 1; min-height: 42px; border: none; border-radius: 999px;
    background: transparent; color: var(--ink-soft);
    font-weight: 800; font-size: 0.9rem;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .seg button.on {
    background: linear-gradient(180deg, var(--green), var(--forest));
    color: var(--white); box-shadow: 0 3px 9px rgba(11,93,51,0.24);
  }

  /* ---------- Entry history rows ---------- */
  .hist-cg {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 0; font-size: 0.92rem;
    border-bottom: 1px dashed rgba(11,93,51,0.18);
  }
  .hist-cg:last-child { border-bottom: none; }
  .tag-num {
    font-size: 0.74rem; color: var(--forest); font-family: var(--mono); font-weight: 700;
    background: var(--white); border: 2px solid var(--line-soft);
    padding: 2px 9px; border-radius: 999px;
  }
  .tag-fl { font-size: 0.78rem; color: #7D6413; font-weight: 800; }
  .tag-type {
    font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 999px;
    background: var(--sand, #E9D8A6); color: #6b5a1f;
  }
  .tag-type.course { background: rgba(31,122,68,0.16); color: var(--forest); }

  /* ---------- Empty state (a hazard) ---------- */
  .empty { text-align: center; padding: 34px 20px 40px; color: var(--ink-soft); }
  .empty .big {
    width: 108px; height: 76px; margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 2.4rem;
    background: var(--sand);
    border-radius: 46% 54% 60% 40% / 52% 46% 54% 48%;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.10);
  }
  .empty h3 { margin-bottom: 6px; }
  .empty p { max-width: 330px; margin: 0 auto 16px; font-size: 0.92rem; }

  /* ---------- Stats grid (Prep) ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    background: var(--white); border: 2px solid var(--line-soft);
    border-radius: var(--radius-sm); padding: 13px 15px; text-align: left;
  }
  .stat .num { font-size: 1.8rem; font-weight: 800; color: var(--green); line-height: 1.05; font-family: var(--mono); }
  .stat .lbl { font-size: 0.7rem; color: var(--ink-soft); margin-top: 3px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }

  .kv {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px dashed rgba(11,93,51,0.20);
  }
  .kv:last-child { border-bottom: none; }
  .kv .k { font-weight: 700; }
  .kv .v { color: var(--green); font-weight: 800; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .kv .v.grey { color: var(--ink-soft); }

  /* progress bar */
  .bar-track {
    height: 12px; border-radius: 999px; background: var(--ivory);
    overflow: hidden; margin-top: 7px; border: 2px solid var(--line-soft);
  }
  .bar-fill {
    height: 100%; border-radius: 999px;
    background: repeating-linear-gradient(115deg, var(--fairway) 0 9px, var(--green) 9px 18px);
  }

  .note-line {
    padding: 11px 14px; background: var(--white); border-radius: var(--radius-sm);
    margin-bottom: 9px; border: 2px solid var(--line-soft); font-size: 0.94rem;
  }
  .note-line .d { font-size: 0.68rem; color: var(--gold); font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }

  /* ---------- Terms / rulebook ---------- */
  .term-row { padding: 12px 0; border-bottom: 1px dashed rgba(11,93,51,0.18); }
  .term-row:last-child { border-bottom: none; padding-bottom: 0; }
  .term-row:first-of-type { padding-top: 2px; }
  .term-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .term-name { font-weight: 800; font-size: 1.02rem; color: var(--forest); }
  .term-def { color: var(--ink-soft); font-size: 0.91rem; line-height: 1.55; }

  /* ---------- Charts ---------- */
  .chart-wrap { width: 100%; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 9px 14px; margin-top: 12px; font-size: 0.78rem; color: var(--ink-soft); font-weight: 700; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; }

  /* ---------- Drill form rows ---------- */
  .drill-row { display: flex; gap: 8px; margin-bottom: 9px; align-items: center; }
  .drill-row input { flex: 1; }
  .drill-row .rm {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(214,69,65,0.35); background: var(--white);
    color: #B23A36; font-size: 1.3rem; font-weight: 800; line-height: 1;
  }

  /* ---------- Modal ---------- */
  .modal-back {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(10,61,36,0.42); backdrop-filter: blur(3px);
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
  }
  .modal {
    background: var(--white); width: 100%; max-width: 560px;
    border-radius: 30px 30px 0 0; border: none;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
    box-shadow: 0 -14px 44px rgba(10,61,36,0.30);
    animation: slideup 0.24s cubic-bezier(.22,.9,.3,1);
  }
  @keyframes slideup { from { transform: translateY(34px); opacity: 0.5; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .modal-head h3 { font-size: 1.24rem; }
  .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
  .modal-actions .btn { flex: 1; }

  /* ---------- Toast (the putt drops) ---------- */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
    background: var(--forest); color: var(--white);
    padding: 13px 22px; border-radius: 999px; font-weight: 800;
    z-index: 80; box-shadow: 0 8px 24px rgba(10,61,36,0.34);
    display: flex; align-items: center; gap: 9px;
    animation: toastin 0.26s cubic-bezier(.22,.9,.3,1);
    max-width: calc(100vw - 32px);
  }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .toast .ball {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 36% 30%, #ffffff, #DCE6DC);
    box-shadow: inset -2px -3px 5px rgba(0,0,0,0.16);
    animation: settle 0.62s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes settle {
    0% { transform: translateY(-22px) scale(0.8); }
    55% { transform: translateY(0) scale(1.08, 0.9); }
    75% { transform: translateY(-5px) scale(0.98, 1.03); }
    100% { transform: translateY(0) scale(1); }
  }

  /* ---------- Password lock = the front gate ---------- */
  .lock {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--white);
    background-image:
      radial-gradient(90% 55% at 50% 118%, rgba(31,122,68,0.30), transparent 62%),
      repeating-linear-gradient(115deg, rgba(31,122,68,0.035) 0 46px, rgba(76,175,80,0.065) 46px 92px);
  }
  .lock-card {
    width: 100%; max-width: 372px; text-align: center;
    background: var(--white); border: 2px solid var(--line);
    border-radius: 30px; padding: 32px 24px 26px; box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .lock-card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 9px;
    background: repeating-linear-gradient(90deg, var(--forest) 0 22px, var(--white) 22px 44px);
  }
  .lock-logo { width: 82px; height: 82px; margin: 8px auto 14px; display: block; filter: drop-shadow(0 4px 10px rgba(11,93,51,0.22)); }
  .lock-card .eyebrow { display: block; font-size: 0.64rem; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .lock-card h2 { font-size: 1.6rem; margin-bottom: 4px; }
  .lock-card input { margin-top: 18px; text-align: center; font-size: 1.08rem; letter-spacing: 0.05em; }
  .lock-error { color: #B23A36; font-size: 0.86rem; min-height: 1.2em; margin-top: 10px; font-weight: 800; }
  .lock-card .btn { margin-top: 14px; height: 52px; }

  .hidden { display: none !important; }
  .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
  .muted { color: var(--ink-soft); font-size: 0.88rem; }
  .link { color: var(--green); font-weight: 800; text-decoration: underline; background: none; border: none; padding: 0; font-size: inherit; cursor: pointer; }

  /* ============================================================
     Desktop layout — clubhouse with a yardage-post side nav
     ============================================================ */
  @media (min-width: 860px) {
    .tabnav { display: none; }
    .app { flex-direction: column; }
    .shell { max-width: 1120px; margin: 0 auto; width: 100%; }
    .sidenav {
      display: flex; flex-direction: column; gap: 6px;
      width: 224px; flex: none; padding: 22px 14px;
      position: sticky; top: 84px; align-self: flex-start;
    }
    .sidenav button {
      display: flex; align-items: center; gap: 12px;
      height: 50px; padding: 0 18px; border-radius: 999px;
      background: none; border: 2px solid transparent; color: var(--ink-soft);
      font-size: 0.98rem; font-weight: 800; text-align: left; width: 100%;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .sidenav button .ic { display: block; width: 21px; height: 21px; flex: none; }
    .sidenav button .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .sidenav button:hover { background: var(--ivory); color: var(--forest); }
    .sidenav button.active {
      background: linear-gradient(180deg, var(--green), var(--forest));
      color: var(--white); box-shadow: 0 5px 14px rgba(11,93,51,0.26);
    }
    .main { max-width: none; margin: 0; padding: 26px 30px 56px; }
    .savebar { position: static; padding: 8px 0 0; margin: 0; background: none; max-width: none; }
    .savebar .btn { max-width: 330px; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
    .modal-back { align-items: center; padding: 20px; }
    .modal { border-radius: 30px; }
    .toast { bottom: 30px; }
  }

  @media (min-width: 560px) and (max-width: 859px) {
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .hw-box svg path { stroke-dashoffset: 26; }
    .hw-item.on .hw-box svg path { stroke-dashoffset: 0; }
  }
</style>
</head>

<script>
/* ============================================================================
   RangeLog
   ----------------------------------------------------------------------------
   Organization:
     1. Constants
     2. DATA LAYER  — loadData() / saveData() are the ONLY localStorage touch-
                      points. Swap them for a network layer later.
     3. State & helpers
     4. RENDER functions (one per view) + shared UI (toast, modal)
     5. EVENT WIRING / router
   ============================================================================ */

/* ---------- 1. Constants ---------- */
const STORAGE_KEY = 'rangelog_v1';

const CLUB_GROUPS = ['Driver', 'Woods/Hybrids', 'Long Irons', 'Mid Irons', 'Wedges'];
// The default ball-flight tendencies. The live list is editable in Settings and
// stored under data.settings.flights — read it via flightOptions().
const DEFAULT_FLIGHTS = ['Straight', 'Pull', 'Push', 'Slice', 'Hook', 'Fat', 'Thin'];

// Session types — range practice vs. on-course rounds.
const SESSION_TYPES = [
  { id: 'range', label: 'Range' },
  { id: '9',     label: '9 holes' },
  { id: '18',    label: '18 holes' }
];
function sessionTypeLabel(id) {
  const t = SESSION_TYPES.find(x => x.id === id);
  return t ? t.label : 'Range';
}

// Colors used for ball-flight distribution charts (tuned for the light ground).
const FLIGHT_COLORS = {
  Straight: '#1F7A44',
  Pull:     '#C9A227',
  Push:     '#2E86C1',
  Slice:    '#D64541',
  Hook:     '#8E5BC9',
  Fat:      '#8A6A3C',
  Thin:     '#3F9E93'
};
// Fallback palette for user-added custom tendencies (deterministic by name).
const FALLBACK_FLIGHT_COLORS = ['#E07A5F', '#6C91BF', '#3D8361', '#B5838D', '#9A7BB8', '#C08457', '#4C9A8E', '#A9772A'];
function flightColor(f) {
  if (FLIGHT_COLORS[f]) return FLIGHT_COLORS[f];
  let h = 0; for (let i = 0; i < f.length; i++) h = (h * 31 + f.charCodeAt(i)) >>> 0;
  return FALLBACK_FLIGHT_COLORS[h % FALLBACK_FLIGHT_COLORS.length];
}
/** Current ball-flight tendency options (editable in Settings). */
function flightOptions() {
  const f = DATA && DATA.settings && DATA.settings.flights;
  return (Array.isArray(f) && f.length) ? f : DEFAULT_FLIGHTS;
}
/** Chart order: options first, then any extra flight names still present in data. */
function flightOrder(present) {
  const opts = flightOptions();
  return [...opts, ...(present || []).filter(p => !opts.includes(p))];
}

// Small inline-SVG kit — rounded, illustrated, no external assets.
const SVG = {
  ball: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FBFBF4"/><circle cx="9" cy="9" r="1.1" fill="rgba(11,93,51,.22)"/><circle cx="13" cy="8" r="1.1" fill="rgba(11,93,51,.18)"/><circle cx="15.5" cy="12" r="1.1" fill="rgba(11,93,51,.18)"/><circle cx="11" cy="13" r="1.1" fill="rgba(11,93,51,.18)"/><circle cx="8.5" cy="15" r="1.1" fill="rgba(11,93,51,.16)"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  tick: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.6 10 17l8.5-9.6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>'
};

// ---- Terms dictionary (beginner-friendly glossary) ----
// Grouped by category; rendered in the Terms view with a search filter.
const TERMS = [
  // Ball flight & misses
  { term: 'Straight',   cat: 'Ball Flight', def: 'The ball starts on target and holds its line. The goal on every swing.' },
  { term: 'Pull',       cat: 'Ball Flight', def: 'Starts left of target and stays left (for a right-hander). Often an over-the-top path or a closed clubface.' },
  { term: 'Push',       cat: 'Ball Flight', def: 'Starts right of target and stays right. Usually an in-to-out path with the face square to that path.' },
  { term: 'Slice',      cat: 'Ball Flight', def: 'Starts left-ish then curves hard right — the most common beginner miss. Caused by an open clubface relative to the swing path.' },
  { term: 'Hook',       cat: 'Ball Flight', def: 'Curves sharply left. Caused by a clubface closed relative to the swing path.' },
  { term: 'Fade',       cat: 'Ball Flight', def: 'A small, controlled left-to-right curve (for a right-hander) — the tamed, playable version of a slice.' },
  { term: 'Draw',       cat: 'Ball Flight', def: 'A small, controlled right-to-left curve — the tamed, playable version of a hook.' },
  // Contact & strike
  { term: 'Fat',        cat: 'Contact',     def: 'The club hits the ground before the ball (also "chunk" or "heavy"). Steals distance and height.' },
  { term: 'Thin',       cat: 'Contact',     def: 'The club catches the top half of the ball (also "skulled" or "bladed"). Produces a low, hot shot.' },
  { term: 'Flush',      cat: 'Contact',     def: 'A perfectly struck shot from the center of the face — what a 5/5 contact rating feels like.' },
  { term: 'Shank',      cat: 'Contact',     def: 'Struck off the hosel (where shaft meets head), firing sharply right. Common when standing too close.' },
  { term: 'Toe / Heel', cat: 'Contact',     def: 'Contact toward the outer tip (toe) or inner end (heel) of the clubface instead of the center.' },
  { term: 'Contact quality', cat: 'Contact', def: 'How centered and clean your strike is. In RangeLog you rate it 1 (mishit) to 5 (flush) per club group.' },
  { term: 'Divot',      cat: 'Contact',     def: 'The strip of turf taken after impact with an iron. A divot that starts after the ball means clean ball-first contact.' },
  // Setup & swing
  { term: 'Swing thought', cat: 'Swing',    def: 'A single simple cue or feel you focus on during the swing (e.g. "turn, don\'t slide"). Your coach gives you one per lesson.' },
  { term: 'Tempo',      cat: 'Swing',       def: 'The rhythm and timing of your swing — roughly a 3-to-1 ratio of backswing to downswing.' },
  { term: 'Weight shift', cat: 'Swing',     def: 'Moving your pressure from the trail foot to the lead foot through the downswing for power and clean contact.' },
  { term: 'Alignment',  cat: 'Swing',       def: 'How your feet, hips, and shoulders point relative to the target line. Alignment sticks are a common drill aid.' },
  { term: 'Grip pressure', cat: 'Swing',    def: 'How tightly you hold the club. Lighter pressure often frees up the swing and improves feel.' },
  { term: 'Takeaway',   cat: 'Swing',       def: 'The very first move of the club away from the ball at the start of the backswing.' },
  { term: 'Follow-through', cat: 'Swing',   def: 'The finish of the swing after impact — a balanced follow-through is a sign of good sequencing.' },
  // Clubs
  { term: 'Driver',     cat: 'Clubs',       def: 'The longest club with the lowest loft, built for maximum distance off the tee.' },
  { term: 'Woods / Hybrids', cat: 'Clubs',  def: 'Fairway woods and hybrids for long shots off the ground. Hybrids are more forgiving than long irons.' },
  { term: 'Long Irons', cat: 'Clubs',       def: 'The 3–5 irons. Lower loft and harder to hit; many beginners replace these with hybrids.' },
  { term: 'Mid Irons',  cat: 'Clubs',       def: 'The 6–8 irons — the workhorse clubs for approach shots into the green.' },
  { term: 'Wedges',     cat: 'Clubs',       def: 'The highest-loft clubs (pitching, gap, sand, lob) for short approaches, chips, and bunker shots.' },
  // On the course — flag color system (pin position on the green)
  { term: '⛳ Red Flag',           cat: 'On the Course', color: '#D64541', def: 'The pin is at the FRONT of the green. Plan for a shorter shot / less club.' },
  { term: '⛳ White or Yellow Flag', cat: 'On the Course', color: '#B08A15', def: 'The pin is in the MIDDLE of the green. Aim for the center.' },
  { term: '⛳ Blue Flag',          cat: 'On the Course', color: '#2E86C1', def: 'The pin is at the BACK of the green. Plan for a longer shot / more club.' },
  { term: 'Flag color system',    cat: 'On the Course', def: 'Many courses color the flags by pin position so you can judge distance from afar: red = front, white/yellow = middle, blue = back. Always check the scorecard — colors can vary by course.' }
];
const TERM_CATS = ['Ball Flight', 'Contact', 'Swing', 'Clubs', 'On the Course'];

/* ============================================================================
   2. DATA LAYER
   ----------------------------------------------------------------------------
   Two tiers, both funneled through a tiny set of functions:
     • Local cache  — loadData()/saveData(): the ONLY localStorage touchpoints.
       Used for instant paint on load and as an offline fallback.
     • Remote sync  — the /api/data serverless endpoint (Upstash Redis) is the
       shared source of truth. All mutations go through mutate(), which applies
       an optimistic local change, queues a server action in an outbox (so a
       flaky range connection never loses a logged session), and reconciles
       with the server's authoritative response. pull() polls for live updates.
   To move to a different backend later, swap apiGet()/apiPost() only.
   ============================================================================ */

const API_URL = '/api/data';
const OUTBOX_KEY = 'rangelog_outbox';
const POLL_MS = 15000;          // live refresh cadence (paused when tab hidden)

// Shared-secret gate. The entered password is stored locally and sent on every
// request as x-rangelog-pass; the server checks it against RANGELOG_PASSWORD
// (default "golf"). OFFLINE_PASS is the fallback used to gate the UI when the
// server can't be reached (local-only use) — keep it equal to the server default.
const PASS_KEY = 'rangelog_pass';
const OFFLINE_PASS = 'golf';
function getPass() { return localStorage.getItem(PASS_KEY) || ''; }

function freshData() {
  return { lessons: [], sessions: [], settings: { flights: DEFAULT_FLIGHTS.slice() } };
}

/** Clean a flight-tendency list: trim, cap length, de-dupe (case-insensitive). */
function normalizeFlightList(arr) {
  if (!Array.isArray(arr)) return null;
  const seen = new Set(); const out = [];
  arr.forEach(f => {
    if (typeof f !== 'string') return;
    const v = f.trim().slice(0, 40);
    const key = v.toLowerCase();
    if (v && !seen.has(key)) { seen.add(key); out.push(v); }
  });
  return out.length ? out.slice(0, 20) : null;
}
function normalizeType(t) {
  return SESSION_TYPES.some(x => x.id === t) ? t : 'range';
}

/**
 * Normalize/migrate a raw data object into the current schema.
 * Migrations: club groups moved single `flight` → `flights` array; sessions
 * gained a `type` (default 'range'); settings.flights holds the editable
 * tendency list (defaults applied when absent).
 */
function normalizeData(parsed) {
  if (!parsed || typeof parsed !== 'object') return freshData();
  const lessons = Array.isArray(parsed.lessons) ? parsed.lessons : [];
  const sessions = (Array.isArray(parsed.sessions) ? parsed.sessions : []).map(s => ({
    ...s,
    type: normalizeType(s.type),
    clubGroups: (Array.isArray(s.clubGroups) ? s.clubGroups : []).map(cg => {
      let flights;
      if (Array.isArray(cg.flights)) flights = cg.flights.filter(Boolean);
      else if (cg.flight) flights = [cg.flight];   // legacy single value
      else flights = [];
      const out = { group: cg.group, contact: cg.contact || 0, flights };
      return out;
    })
  }));
  const flights = normalizeFlightList(parsed.settings && parsed.settings.flights) || DEFAULT_FLIGHTS.slice();
  return { lessons, sessions, settings: { flights } };
}

/** Load the whole app state. Guards against malformed/absent storage. */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshData();
    const parsed = JSON.parse(raw);
    // Basic shape validation — fall back to fresh state if corrupt.
    if (!parsed || typeof parsed !== 'object') return freshData();
    return normalizeData(parsed);
  } catch (e) {
    console.warn('RangeLog: could not parse stored data, starting fresh.', e);
    return freshData();
  }
}

/** Persist the whole app state to the local cache. */
function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('RangeLog: failed to save data.', e);
    toast('⚠️ Could not save (storage full?)');
  }
}

/* ---------- Remote sync (Upstash Redis via /api/data) ---------- */

let syncStatus = 'connecting';  // 'synced' | 'saving' | 'offline' | 'connecting'
let flushing = false;

function authError() { const e = new Error('Unauthorized'); e.auth = true; return e; }

/** GET the shared state. Resolves to {lessons, sessions} or throws. */
async function apiGet() {
  const r = await fetch(API_URL, {
    headers: { Accept: 'application/json', 'x-rangelog-pass': getPass() },
    cache: 'no-store'
  });
  if (r.status === 401) throw authError();
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return normalizeData(await r.json());
}

/** POST an action to the server. Resolves to the server's new full state. */
async function apiPost(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-rangelog-pass': getPass() },
    body: JSON.stringify(body)
  });
  if (r.status === 401) throw authError();
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return normalizeData(data);
}

/* ----- Outbox: queued mutations that must survive a dropped connection ----- */

function loadOutbox() {
  try { return JSON.parse(localStorage.getItem(OUTBOX_KEY)) || []; }
  catch { return []; }
}
function saveOutbox(q) {
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(q)); } catch {}
}
function enqueue(action) {
  const q = loadOutbox();
  q.push(action);
  saveOutbox(q);
}

/**
 * Send queued actions to the server in order. Each server reply is the
 * authoritative merged state, so after the queue drains DATA matches the
 * server. Returns true if the queue fully drained.
 */
async function flushOutbox() {
  if (flushing) return false;
  flushing = true;
  try {
    let q = loadOutbox();
    while (q.length) {
      setSyncStatus('saving');
      let serverState;
      try {
        serverState = await apiPost(q[0]);
      } catch (e) {
        setSyncStatus('offline');
        if (e.auth) showLock();       // password wrong/changed — re-gate
        return false;                 // leave the queue intact; retry later
      }
      q.shift();
      saveOutbox(q);
      applyServerData(serverState);   // converge on the server's version
    }
    setSyncStatus('synced');
    return true;
  } finally {
    flushing = false;
  }
}

/**
 * Adopt server state into DATA + cache, re-rendering without disrupting an
 * in-progress Log entry. No-op when nothing actually changed.
 */
function applyServerData(serverState) {
  if (JSON.stringify(serverState) === JSON.stringify(DATA)) return;
  DATA = serverState;
  saveData(DATA);
  if (currentView === 'terms') return;              // terms don't depend on data
  else if (currentView === 'log') {
    if (logTab === 'history') renderLog();          // refresh the entry list
    else renderHomeworkBlock(activeLesson());       // keep the draft/inputs intact
  }
  else render();
}

/** Pull the latest shared state (after flushing any pending local writes). */
async function pull() {
  const drained = await flushOutbox();
  if (!drained) return;               // still offline / unsynced — keep local
  try {
    const serverState = await apiGet();
    applyServerData(serverState);
    setSyncStatus('synced');
  } catch (e) {
    setSyncStatus('offline');
    if (e.auth) showLock();           // password wrong/changed — re-gate
  }
}

/* ---------- Password gate ---------- */

/**
 * Verify a candidate password. Returns true if it unlocks:
 *  - server says OK (200), or
 *  - server unreachable (no backend / offline) AND it matches OFFLINE_PASS.
 * Returns false for a definite rejection (server 401).
 */
async function tryUnlock(candidate) {
  try {
    const r = await fetch(API_URL, {
      headers: { Accept: 'application/json', 'x-rangelog-pass': candidate },
      cache: 'no-store'
    });
    if (r.ok) return true;
    if (r.status === 401) return false;
    return candidate === OFFLINE_PASS;   // 5xx / misconfigured backend
  } catch {
    return candidate === OFFLINE_PASS;   // network unreachable → local-only gate
  }
}

function beginSync() {
  setSyncStatus('connecting');
  pull().then(startPolling);
}

function setLockError(msg) {
  const e = document.getElementById('lockError');
  if (e) e.textContent = msg || '';
}

/** Full-screen lock overlay — the front gate / starter's booth. Idempotent. */
function showLock() {
  stopPolling();
  if (document.getElementById('lockScreen')) return;
  const el = document.createElement('div');
  el.id = 'lockScreen';
  el.className = 'lock';
  el.innerHTML = `
    <div class="lock-card">
      <svg class="lock-logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <clipPath id="gateClip"><circle cx="32" cy="32" r="26"/></clipPath>
          <radialGradient id="gateSky" cx="32%" cy="26%" r="82%">
            <stop offset="0" stop-color="#8BD450"/><stop offset="1" stop-color="#1F7A44"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="30" fill="#F4F1E4"/>
        <g clip-path="url(#gateClip)">
          <circle cx="32" cy="32" r="26" fill="url(#gateSky)"/>
          <ellipse cx="30" cy="56" rx="34" ry="17" fill="#0B5D33"/>
          <path d="M25 18 V47" stroke="#FBFBF4" stroke-width="3" stroke-linecap="round"/>
          <path d="M26.5 18.5 q10 1.6 15 6 -6.5 3.4 -15 4.8 z" fill="#D64541"/>
          <circle cx="40" cy="44" r="4.6" fill="#FBFBF4"/>
        </g>
        <circle cx="32" cy="32" r="30" fill="none" stroke="#C9A227" stroke-width="3.2"/>
      </svg>
      <span class="eyebrow">Starter's booth</span>
      <h2>RangeLog</h2>
      <p class="muted">Check in to play through.</p>
      <input type="password" id="lockInput" placeholder="Password"
             autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div id="lockError" class="lock-error"></div>
      <button class="btn primary block" id="lockBtn">Unlock</button>
    </div>`;
  document.body.appendChild(el);

  const input = el.querySelector('#lockInput');
  const btn = el.querySelector('#lockBtn');
  const submit = async () => {
    const candidate = input.value;
    if (!candidate) { setLockError('Enter a password'); return; }
    btn.disabled = true; btn.textContent = 'Checking…'; setLockError('');
    const okUnlock = await tryUnlock(candidate);
    if (okUnlock) {
      localStorage.setItem(PASS_KEY, candidate);
      el.remove();
      beginSync();
    } else {
      setLockError('Incorrect password');
      btn.disabled = false; btn.textContent = 'Unlock';
      input.select();
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus(), 60);
}

/**
 * The single write path. Applies `optimistic` to DATA immediately (snappy UI),
 * caches it, queues the server `action`, then flushes. The app stays fully
 * usable offline; writes reconcile when the connection returns.
 */
function mutate(action, optimistic) {
  optimistic();
  saveData(DATA);
  enqueue(action);
  flushOutbox();
}

/* ---------- Sync status indicator (the flag on the clubhouse) ---------- */

const SYNC_LABEL = {
  connecting: { dot: 'var(--ink-faint)', text: 'Connecting…' },
  synced:     { dot: 'var(--green)',     text: 'Live' },
  saving:     { dot: 'var(--gold)',      text: 'Saving…' },
  offline:    { dot: 'var(--flag)',      text: 'Offline' }
};
function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const cfg = SYNC_LABEL[s] || SYNC_LABEL.connecting;
  el.querySelector('.sync-dot').style.background = cfg.dot;
  el.querySelector('.sync-text').textContent = cfg.text;
  el.dataset.state = SYNC_LABEL[s] ? s : 'connecting';
}

/* ============================================================================
   3. State & helpers
   ============================================================================ */

let DATA = loadData();          // in-memory mirror of storage
let currentView = 'log';        // active view id

// Transient form state for the Log view (not persisted until Save).
let logDraft = null;
let logTab = 'new';             // 'new' (entry form) | 'history' (past entries)

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function daysBetween(a, b) {
  return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
}

/** Escape user text for safe HTML insertion. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** The active lesson = most recent lesson by date (tie-break: newest id). */
function activeLesson() {
  if (!DATA.lessons.length) return null;
  return DATA.lessons.slice().sort(sortByDateDesc)[0];
}

function sortByDateDesc(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  return (a.id < b.id) ? 1 : -1;
}

/** Ball-flight tendencies for a club group, tolerant of legacy `flight`. */
function flightsOf(cg) {
  if (Array.isArray(cg.flights)) return cg.flights.filter(Boolean);
  if (cg.flight) return [cg.flight];
  return [];
}

/** Sessions logged on/after the active lesson's date. */
function sessionsSinceActiveLesson() {
  const lesson = activeLesson();
  if (!lesson) return [];
  return DATA.sessions
    .filter(s => s.date >= lesson.date)
    .sort(sortByDateDesc);
}

/* ============================================================================
   4. RENDER
   ============================================================================ */

const main = document.getElementById('main');

function render() {
  // Sync nav highlight
  document.querySelectorAll('#tabnav button, #sidenav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === currentView);
  });
  if (currentView === 'log') renderLog();
  else if (currentView === 'lessons') renderLessons();
  else if (currentView === 'prep') renderPrep();
  else if (currentView === 'trends') renderTrends();
  else if (currentView === 'terms') renderTerms();
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------------------
   VIEW 1: LOG — the range / practice tee
   --------------------------------------------------------------------------- */

function newLogDraft() {
  return {
    date: todayISO(),
    type: 'range',        // 'range' | '9' | '18'
    groups: {},           // group -> { open, contact, flight }
    drillsDone: {},       // drillId -> bool
    note: ''
  };
}

function renderLog() {
  if (!logDraft) logDraft = newLogDraft();

  // Segmented control shared by both sub-tabs.
  const seg = `
    <div class="seg" id="logSeg">
      <button class="${logTab === 'new' ? 'on' : ''}" data-logtab="new">＋ New</button>
      <button class="${logTab === 'history' ? 'on' : ''}" data-logtab="history">History${DATA.sessions.length ? ' (' + DATA.sessions.length + ')' : ''}</button>
    </div>`;

  if (logTab === 'history') renderLogHistory(seg);
  else renderLogForm(seg);

  // Wire the segmented control (present in both sub-tabs).
  document.querySelectorAll('#logSeg button').forEach(b => {
    b.addEventListener('click', () => {
      if (logTab === b.dataset.logtab) return;
      logTab = b.dataset.logtab;
      renderLog();
      window.scrollTo(0, 0);
    });
  });
}

function renderLogForm(seg) {
  const lesson = activeLesson();
  main.innerHTML = `
    <div class="view">
      <div class="view-head">
        <span class="eyebrow">The Range</span>
        <h2>Log Session</h2>
        <div class="sub">Tap what you hit, save in seconds.</div>
      </div>
      ${seg}

      <div class="card">
        <label class="fld" style="margin:0 0 14px">
          <span>Date</span>
          <input type="date" id="logDate" value="${esc(logDraft.date)}" max="${todayISO()}">
        </label>
        <div class="section-label">Session type</div>
        <div class="chip-row" id="typeChips">
          ${SESSION_TYPES.map(t => `<button class="chip sm ${logDraft.type === t.id ? 'on' : ''}" data-type="${t.id}">${t.label}</button>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="section-label">The bag — club groups hit</div>
        <div id="groupBlocks"></div>
      </div>

      <div class="card">
        <div class="section-label">Homework drills</div>
        <div id="hwBlock"></div>
      </div>

      <div class="card">
        <div class="section-label">Note</div>
        <input type="text" id="logNote" placeholder="Anything click today?" value="${esc(logDraft.note)}">
      </div>

      <div style="height:8px"></div>
    </div>

    <div class="savebar">
      <button class="btn primary block" id="saveSession">
        <span style="width:20px;height:20px;display:block">${SVG.ball}</span> Save Session
      </button>
    </div>
  `;

  renderGroupBlocks();
  renderHomeworkBlock(lesson);

  // Wire date + note (kept in draft so redraws don't lose input)
  document.getElementById('logDate').addEventListener('change', e => { logDraft.date = e.target.value; });
  document.getElementById('logNote').addEventListener('input', e => { logDraft.note = e.target.value; });
  document.getElementById('saveSession').addEventListener('click', saveSessionFromDraft);

  // Session type chips (single-select; no full re-render so inputs keep focus)
  main.querySelectorAll('#typeChips [data-type]').forEach(b => b.addEventListener('click', () => {
    logDraft.type = b.dataset.type;
    main.querySelectorAll('#typeChips [data-type]').forEach(x => x.classList.toggle('on', x.dataset.type === logDraft.type));
  }));
}

/** Resolve a drill id to its name across all lessons (drills can outlive a deleted lesson reference). */
function drillNameById(id) {
  for (const l of DATA.lessons) {
    const d = (l.drills || []).find(x => x.id === id);
    if (d) return d.name;
  }
  return null;
}

/** One past entry, rendered as a scorecard with a delete button. */
function sessionEntryHTML(s) {
  const groups = (s.clubGroups || []).map(cg => {
    const flights = flightsOf(cg);
    const contact = cg.contact ? `<span class="tag-num">${cg.contact}/5</span>` : '';
    const fl = flights.length ? `<span class="tag-fl">${flights.map(esc).join(' · ')}</span>` : '';
    return `<div class="hist-cg"><strong style="font-size:0.94rem">${esc(cg.group)}</strong>${contact}${fl}</div>`;
  }).join('') || '<div class="meta">No club groups recorded</div>';

  const drillNames = (s.drillsDone || []).map(drillNameById).filter(Boolean);
  const drills = drillNames.length
    ? `<div class="mt8">${drillNames.map(n => `<span class="drill-tag">✓ ${esc(n)}</span>`).join('')}</div>`
    : '';
  const note = s.note ? `<div class="mt8 muted"><em>“${esc(s.note)}”</em></div>` : '';

  return `
    <div class="row-item">
      <div class="grow">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
          <strong>${fmtDate(s.date)}</strong>
          <span class="tag-type ${s.type && s.type !== 'range' ? 'course' : ''}">${sessionTypeLabel(s.type)}</span>
        </div>
        <div class="mt8">${groups}</div>
        ${drills}
        ${note}
      </div>
      <button class="btn sm danger" data-del-session="${esc(s.id)}">Delete</button>
    </div>`;
}

function renderLogHistory(seg) {
  const sessions = DATA.sessions.slice().sort(sortByDateDesc);
  const list = sessions.length
    ? sessions.map(sessionEntryHTML).join('')
    : emptyState('⛳', 'In the bunker', 'Nothing logged yet — the card is blank. Switch to “New” and hit a few.');

  main.innerHTML = `
    <div class="view">
      <div class="view-head">
        <span class="eyebrow">Rounds logged</span>
        <h2>Entry Log</h2>
        <div class="sub">${sessions.length} session${sessions.length === 1 ? '' : 's'} on the card.</div>
      </div>
      ${seg}
      <div class="mt12">${list}</div>
    </div>`;

  main.querySelectorAll('[data-del-session]').forEach(b =>
    b.addEventListener('click', () => deleteSession(b.dataset.delSession)));
}

function deleteSession(id) {
  const s = DATA.sessions.find(x => x.id === id);
  if (!s) return;
  confirmModal('Delete this entry?',
    `Your ${fmtDate(s.date)} range session will be permanently removed.`,
    () => {
      mutate({ action: 'delete-session', id }, () => {
        DATA.sessions = DATA.sessions.filter(x => x.id !== id);
      });
      closeModal();
      renderLog();
      toast('🗑️ Entry deleted');
    });
}

function renderGroupBlocks() {
  const wrap = document.getElementById('groupBlocks');
  if (!wrap) return;
  wrap.innerHTML = CLUB_GROUPS.map(g => {
    const st = logDraft.groups[g];
    const on = !!st;
    let panel = '';
    if (on) {
      const dots = [1,2,3,4,5].map(n =>
        `<button class="dot ${st.contact === n ? 'on' : ''}" data-grp="${esc(g)}" data-contact="${n}" aria-label="Contact ${n} of 5">${n}</button>`
      ).join('');
      const sel = st.flights || [];
      const flights = flightOptions().map(f =>
        `<button class="chip sm ${sel.includes(f) ? 'on' : ''}" data-grp="${esc(g)}" data-flight="${esc(f)}">${esc(f)}</button>`
      ).join('');
      panel = `
        <div class="group-panel">
          <div class="lbl">Contact quality (1 = mishit · 5 = flush)</div>
          <div class="contact-dots">${dots}</div>
          <div class="lbl">Ball flight tendency — tap all that apply</div>
          <div class="chip-row">${flights}</div>
        </div>`;
    }
    return `
      <div class="group-block">
        <button class="chip ${on ? 'on' : ''}" style="width:100%; justify-content:space-between" data-grp-toggle="${esc(g)}">
          <span>${g}</span><span style="font-family:var(--mono)">${on ? '✓' : '+'}</span>
        </button>
        ${panel}
      </div>`;
  }).join('');

  // Toggle group open/closed
  wrap.querySelectorAll('[data-grp-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.grpToggle;
      if (logDraft.groups[g]) delete logDraft.groups[g];
      else logDraft.groups[g] = { contact: 0, flights: [] };
      renderGroupBlocks();
    });
  });
  // Contact dots
  wrap.querySelectorAll('[data-contact]').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.grp;
      logDraft.groups[g].contact = Number(btn.dataset.contact);
      renderGroupBlocks();
    });
  });
  // Flight chips (multi-select — toggle each on/off independently)
  wrap.querySelectorAll('[data-flight]').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.grp, f = btn.dataset.flight;
      const list = logDraft.groups[g].flights || (logDraft.groups[g].flights = []);
      const i = list.indexOf(f);
      if (i === -1) list.push(f); else list.splice(i, 1);
      renderGroupBlocks();
    });
  });
}

function renderHomeworkBlock(lesson) {
  const wrap = document.getElementById('hwBlock');
  if (!wrap) return;

  if (!lesson) {
    wrap.innerHTML = `
      <p class="muted">No lesson yet — add one to start tracking homework.
      <button class="link" data-goto="lessons">Go to Lessons →</button></p>`;
    wrap.querySelector('[data-goto]').addEventListener('click', () => switchView('lessons'));
    return;
  }
  if (!lesson.drills.length) {
    wrap.innerHTML = `<p class="muted">Your latest lesson has no drills. Add drills on the Lessons tab.</p>`;
    return;
  }

  wrap.innerHTML = `
    <p class="muted" style="margin-bottom:11px">From your ${fmtDateShort(lesson.date)} lesson — did you work on this?</p>
    ${lesson.drills.map(d => {
      const on = !!logDraft.drillsDone[d.id];
      return `
        <div class="hw-item ${on ? 'on' : ''}" data-drill="${esc(d.id)}">
          <div class="hw-box">${SVG.tick}</div>
          <div class="hw-name">${esc(d.name)}</div>
        </div>`;
    }).join('')}
  `;
  wrap.querySelectorAll('[data-drill]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.drill;
      logDraft.drillsDone[id] = !logDraft.drillsDone[id];
      renderHomeworkBlock(lesson);
    });
  });
}

function saveSessionFromDraft() {
  const groupKeys = Object.keys(logDraft.groups);
  if (!groupKeys.length) {
    toast('⛳ Tap at least one club group first');
    return;
  }
  const clubGroups = groupKeys.map(g => ({
    group: g,
    contact: logDraft.groups[g].contact || 0,
    flights: (logDraft.groups[g].flights || []).slice()
  }));
  const drillsDone = Object.keys(logDraft.drillsDone).filter(id => logDraft.drillsDone[id]);

  const session = {
    id: uid(),
    date: logDraft.date || todayISO(),
    type: logDraft.type || 'range',
    clubGroups,
    drillsDone,
    note: (logDraft.note || '').trim()
  };
  mutate({ action: 'add-session', session }, () => { DATA.sessions.push(session); });

  logDraft = newLogDraft();
  renderLog();
  toast('Session saved', true);
}

function renderLessons() {
  const active = activeLesson();
  const lessons = DATA.lessons.slice().sort(sortByDateDesc);

  let list;
  if (!lessons.length) {
    list = emptyState('🏌️', 'The lesson tee is empty',
      'Add your first lesson to capture what your coach worked on and the drills to practice.');
  } else {
    list = lessons.map(l => {
      const isActive = active && l.id === active.id;
      const drills = l.drills.length
        ? l.drills.map(d => `<span class="drill-tag">${esc(d.name)}</span>`).join('')
        : '<span class="meta">No drills</span>';
      return `
        <div class="row-item ${isActive ? 'active-lesson' : ''}">
          <div class="grow">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
              <strong>${fmtDate(l.date)}</strong>
              ${isActive ? '<span class="pill">Active homework</span>' : ''}
            </div>
            ${l.focus ? `<div class="mt8"><span class="meta">Focus:</span> ${esc(l.focus)}</div>` : ''}
            ${l.swingThought ? `<div class="mt8 muted"><em>“${esc(l.swingThought)}”</em></div>` : ''}
            <div class="mt8">${drills}</div>
            <div class="mt12" style="display:flex; gap:8px">
              <button class="btn sm ghost" data-edit="${esc(l.id)}">Edit</button>
              <button class="btn sm danger" data-del="${esc(l.id)}">Delete</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  main.innerHTML = `
    <div class="view">
      <div class="view-head">
        <span class="eyebrow">The Pro Shop</span>
        <h2>Lessons</h2>
        <div class="sub">Your most recent lesson sets the current homework.</div>
      </div>
      <button class="btn primary block mt8" id="addLesson">＋ Add Lesson</button>
      <div class="mt16">${list}</div>
    </div>`;

  document.getElementById('addLesson').addEventListener('click', () => openLessonForm());
  main.querySelectorAll('[data-edit]').forEach(b =>
    b.addEventListener('click', () => openLessonForm(b.dataset.edit)));
  main.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => deleteLesson(b.dataset.del)));
}

function openLessonForm(id) {
  const editing = id ? DATA.lessons.find(l => l.id === id) : null;
  const drills = editing ? editing.drills.map(d => ({ ...d })) : [{ id: uid(), name: '' }];

  const body = `
    <label class="fld">
      <span>Date</span>
      <input type="date" id="fDate" value="${esc(editing ? editing.date : todayISO())}" max="${todayISO()}">
    </label>
    <label class="fld">
      <span>Focus — what did your coach work on?</span>
      <input type="text" id="fFocus" placeholder="e.g. Weight shift, grip pressure" value="${esc(editing ? editing.focus : '')}">
    </label>
    <label class="fld">
      <span>Swing thought — the key feel/cue</span>
      <input type="text" id="fThought" placeholder="e.g. Turn, don't slide" value="${esc(editing ? editing.swingThought : '')}">
    </label>
    <div class="section-label">Homework drills (1–3)</div>
    <div id="drillRows"></div>
    <button class="btn sm ghost" id="addDrill">＋ Add drill</button>
  `;

  openModal(editing ? 'Edit Lesson' : 'Add Lesson', body, [
    { label: 'Cancel', cls: 'ghost', onClick: closeModal },
    { label: editing ? 'Save Changes' : 'Save Lesson', cls: 'primary', onClick: () => submitLesson(editing, drills) }
  ]);

  // Render drill rows (managed in closure `drills`)
  function drawDrills() {
    const box = document.getElementById('drillRows');
    box.innerHTML = drills.map((d, i) => `
      <div class="drill-row">
        <input type="text" placeholder="Drill ${i + 1} name" data-di="${i}" value="${esc(d.name)}">
        ${drills.length > 1 ? `<button class="rm" data-rm="${i}">×</button>` : ''}
      </div>`).join('');
    box.querySelectorAll('[data-di]').forEach(inp =>
      inp.addEventListener('input', e => { drills[Number(e.target.dataset.di)].name = e.target.value; }));
    box.querySelectorAll('[data-rm]').forEach(btn =>
      btn.addEventListener('click', () => { drills.splice(Number(btn.dataset.rm), 1); drawDrills(); }));
    document.getElementById('addDrill').classList.toggle('hidden', drills.length >= 3);
  }
  drawDrills();
  document.getElementById('addDrill').addEventListener('click', () => {
    if (drills.length < 3) { drills.push({ id: uid(), name: '' }); drawDrills(); }
  });
}

function submitLesson(editing, drills) {
  const date = document.getElementById('fDate').value || todayISO();
  const focus = document.getElementById('fFocus').value.trim();
  const swingThought = document.getElementById('fThought').value.trim();
  const cleanDrills = drills
    .map(d => ({ id: d.id, name: d.name.trim() }))
    .filter(d => d.name.length);

  if (!focus && !swingThought && !cleanDrills.length) {
    toast('Add a focus, swing thought, or at least one drill');
    return;
  }

  const lesson = {
    id: editing ? editing.id : uid(),
    date, focus, swingThought, drills: cleanDrills
  };
  mutate({ action: 'upsert-lesson', lesson }, () => {
    const idx = DATA.lessons.findIndex(l => l.id === lesson.id);
    if (idx >= 0) DATA.lessons[idx] = lesson;
    else DATA.lessons.push(lesson);
  });
  closeModal();
  renderLessons();
  toast(editing ? 'Lesson updated' : 'Lesson added', true);
}

function deleteLesson(id) {
  const lesson = DATA.lessons.find(l => l.id === id);
  if (!lesson) return;
  confirmModal('Delete this lesson?',
    `The ${fmtDate(lesson.date)} lesson and its drills will be removed. Logged sessions stay, but references to its drills are dropped.`,
    () => {
      mutate({ action: 'delete-lesson', id }, () => {
        DATA.lessons = DATA.lessons.filter(l => l.id !== id);
      });
      closeModal();
      renderLessons();
      toast('🗑️ Lesson deleted');
    });
}

/* ---------------------------------------------------------------------------
   VIEW 3: PREP — the caddie report you hand your coach
   --------------------------------------------------------------------------- */

function renderPrep() {
  const lesson = activeLesson();

  if (!lesson) {
    main.innerHTML = `
      <div class="view">
        <div class="view-head"><span class="eyebrow">The Caddie Report</span><h2>Prep</h2><div class="sub">A summary to show your coach.</div></div>
        ${emptyState('📋', 'Nothing to hand over', 'Add a lesson first — Prep summarizes every range session since your latest lesson.')}
      </div>`;
    return;
  }

  const sessions = sessionsSinceActiveLesson();

  // --- Homework completion per drill ---
  const hwRows = lesson.drills.map(d => {
    const count = sessions.filter(s => (s.drillsDone || []).includes(d.id)).length;
    const pct = sessions.length ? Math.round(count / sessions.length * 100) : 0;
    return `
      <div style="margin-bottom:13px">
        <div class="kv" style="border:none; padding:0 0 2px">
          <span class="k">${esc(d.name)}</span>
          <span class="v">${count}/${sessions.length} sessions</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  }).join('') || '<p class="muted">This lesson has no drills.</p>';

  // --- Contact averages ---
  const allContacts = [];
  const byGroupContacts = {};
  const byGroupFlights = {};
  sessions.forEach(s => {
    (s.clubGroups || []).forEach(cg => {
      if (cg.contact > 0) {
        allContacts.push(cg.contact);
        (byGroupContacts[cg.group] = byGroupContacts[cg.group] || []).push(cg.contact);
      }
      flightsOf(cg).forEach(f => {
        byGroupFlights[cg.group] = byGroupFlights[cg.group] || {};
        byGroupFlights[cg.group][f] = (byGroupFlights[cg.group][f] || 0) + 1;
      });
    });
  });
  const avg = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
  const overallAvg = avg(allContacts);

  const contactRows = CLUB_GROUPS.filter(g => byGroupContacts[g]).map(g => {
    const a = avg(byGroupContacts[g]);
    return `<div class="kv"><span class="k">${g}</span><span class="v">${a.toFixed(1)} <span style="color:var(--ink-faint);font-weight:400">/5</span></span></div>`;
  }).join('') || '<p class="muted">No contact ratings logged yet.</p>';

  // --- Most common miss per group ---
  const missRows = CLUB_GROUPS.filter(g => byGroupFlights[g]).map(g => {
    const counts = byGroupFlights[g];
    let best = null, bestN = 0;
    Object.keys(counts).forEach(f => { if (counts[f] > bestN) { bestN = counts[f]; best = f; } });
    const isMiss = best !== 'Straight';
    return `<div class="kv"><span class="k">${g}</span>
      <span class="v ${isMiss ? '' : 'grey'}" style="${isMiss ? 'color:#7D6413' : ''}">${best} ×${bestN}</span></div>`;
  }).join('') || '<p class="muted">No ball-flight data logged yet.</p>';

  // --- Notes ---
  const notes = sessions.filter(s => s.note).map(s =>
    `<div class="note-line"><div class="d">${fmtDateShort(s.date)}</div>${esc(s.note)}</div>`
  ).join('') || '<p class="muted">No session notes recorded.</p>';

  const span = daysBetween(lesson.date, todayISO());

  main.innerHTML = `
    <div class="view">
      <div class="view-head">
        <span class="eyebrow">The Caddie Report</span>
        <h2>Prep</h2>
        <div class="sub">Since your ${fmtDate(lesson.date)} lesson${span >= 0 ? ` · ${span} day${span === 1 ? '' : 's'} ago` : ''}</div>
      </div>

      <div class="card raised scorecard">
        <div class="section-label">Since last lesson</div>
        ${lesson.focus ? `<p style="margin-bottom:6px"><span class="meta">Focus:</span> ${esc(lesson.focus)}</p>` : ''}
        ${lesson.swingThought ? `<p class="muted" style="margin-bottom:13px"><em>“${esc(lesson.swingThought)}”</em></p>` : ''}
        <div class="stat-grid">
          <div class="stat"><div class="num">${sessions.length}</div><div class="lbl">Range sessions</div></div>
          <div class="stat"><div class="num">${overallAvg ? overallAvg.toFixed(1) : '–'}</div><div class="lbl">Avg contact /5</div></div>
          <div class="stat"><div class="num">${lesson.drills.length}</div><div class="lbl">Homework drills</div></div>
          <div class="stat"><div class="num">${notes === '' ? 0 : sessions.filter(s=>s.note).length}</div><div class="lbl">Notes logged</div></div>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Homework completion</div>
        ${hwRows}
      </div>

      <div class="card">
        <div class="section-label">Average contact by club group</div>
        ${contactRows}
      </div>

      <div class="card">
        <div class="section-label">Most common ball flight by group</div>
        ${missRows}
      </div>

      <div class="card">
        <div class="section-label">Session notes</div>
        ${notes}
      </div>
    </div>`;
}
