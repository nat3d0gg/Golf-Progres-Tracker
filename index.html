/** Bar chart: sessions per week over the last 8 weeks — rounded turf bars. */
function drawWeeksChart(sessions) {
  const weeks = 8;
  const now = new Date(todayISO());
  // Build 8 week buckets ending this week (week = 7-day window).
  const buckets = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const end = new Date(now); end.setDate(now.getDate() - i * 7);
    const start = new Date(end); start.setDate(end.getDate() - 6);
    buckets.push({ start, end, count: 0, label: `${end.getMonth()+1}/${end.getDate()}` });
  }
  const earliest = buckets[0].start;
  sessions.forEach(s => {
    const d = new Date(s.date);
    if (d < earliest) return;
    for (const b of buckets) { if (d >= b.start && d <= b.end) { b.count++; break; } }
  });

  const W = 640, H = 210, padL = 30, padB = 30, padT = 16, padR = 10;
  const maxV = Math.max(3, ...buckets.map(b => b.count));
  const cw = (W - padL - padR) / weeks;
  const bw = cw * 0.56;
  const chartH = H - padB - padT;

  let bars = '', labels = '';
  buckets.forEach((b, i) => {
    const x = padL + i * cw + (cw - bw) / 2;
    const h = maxV ? (b.count / maxV) * chartH : 0;
    const y = padT + chartH - h;
    if (h > 0) {
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, bw/2)}" rx="${bw/2}" fill="url(#gGreen)"></rect>`;
      bars += `<text x="${x + bw/2}" y="${y - 7}" fill="${C_INK}" font-size="12" text-anchor="middle" font-weight="800">${b.count}</text>`;
    } else {
      bars += `<circle cx="${x + bw/2}" cy="${padT + chartH - 3}" r="3" fill="${C_GRID}"></circle>`;
    }
    labels += `<text x="${x + bw/2}" y="${H - 9}" fill="${C_AXIS}" font-size="10.5" text-anchor="middle" font-weight="700">${b.label}</text>`;
  });
  // y gridlines
  let grid = '';
  for (let v = 0; v <= maxV; v++) {
    const y = padT + chartH - (v / maxV) * chartH;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${C_GRID}" stroke-width="1.5" stroke-linecap="round"></line>`;
    grid += `<text x="${padL-8}" y="${y+3.5}" fill="${C_AXIS}" font-size="10" text-anchor="end" font-weight="700">${v}</text>`;
  }

  document.getElementById('chartWeeks').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sessions per week">
      <defs><linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8BD450"></stop><stop offset="1" stop-color="#1F7A44"></stop>
      </linearGradient></defs>
      ${grid}${bars}${labels}
    </svg>`;
}

/** Line chart: contact quality over time, over a mower-striped plot, with flagstick lesson markers. */
function drawContactChart(sessions) {
  const el = document.getElementById('chartContact');
  if (!el) return;

  // Build (date, avgContact) points filtered by group.
  const pts = [];
  sessions.forEach(s => {
    let vals = (s.clubGroups || []).filter(cg => cg.contact > 0);
    if (trendGroupFilter !== 'All') vals = vals.filter(cg => cg.group === trendGroupFilter);
    if (!vals.length) return;
    const a = vals.reduce((acc, cg) => acc + cg.contact, 0) / vals.length;
    pts.push({ t: Date.parse(s.date), v: a, date: s.date });
  });

  if (pts.length === 0) {
    el.innerHTML = `<p class="muted" style="padding:20px 0">No contact data for ${esc(trendGroupFilter)}.</p>`;
    return;
  }

  const W = 640, H = 230, padL = 32, padR = 16, padT = 18, padB = 32;
  const chartW = W - padL - padR, chartH = H - padT - padB;

  const times = pts.map(p => p.t);
  let minT = Math.min(...times), maxT = Math.max(...times);
  if (minT === maxT) { minT -= 86400000; maxT += 86400000; } // pad single point
  const xOf = t => padL + ((t - minT) / (maxT - minT)) * chartW;
  const yOf = v => padT + chartH - ((v - 1) / 4) * chartH;   // scale 1..5

  // mower-stripe plot bed + gridlines for contact 1..5
  let grid = `<rect x="${padL}" y="${padT}" width="${chartW}" height="${chartH}" rx="14" fill="url(#gStripe)"></rect>`;
  for (let v = 1; v <= 5; v++) {
    const y = yOf(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${C_GRID}" stroke-width="1.5" stroke-linecap="round"></line>`;
    grid += `<text x="${padL-8}" y="${y+3.5}" fill="${C_AXIS}" font-size="10" text-anchor="end" font-weight="700">${v}</text>`;
  }

  // lesson markers — little flagsticks planted on the plot
  let markers = '';
  DATA.lessons.forEach(l => {
    const t = Date.parse(l.date);
    if (t < minT || t > maxT) return;
    const x = xOf(t);
    markers += `<line x1="${x}" y1="${padT+6}" x2="${x}" y2="${padT+chartH}" stroke="#C9A227" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.85"></line>`;
    markers += `<path d="M${x} ${padT+3} q9 1.6 13 5 -5.6 3 -13 4.2 z" fill="#C9A227"></path>`;
  });

  // line + points
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xOf(p.t).toFixed(1)} ${yOf(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map(p =>
    `<circle cx="${xOf(p.t).toFixed(1)}" cy="${yOf(p.v).toFixed(1)}" r="5" fill="#FBFBF4" stroke="#1F7A44" stroke-width="3"></circle>`
  ).join('');
  // area under line
  const area = `${line} L${xOf(pts[pts.length-1].t).toFixed(1)} ${padT+chartH} L${xOf(pts[0].t).toFixed(1)} ${padT+chartH} Z`;

  // x labels (first & last)
  const xlabels = `
    <text x="${xOf(pts[0].t)}" y="${H-9}" fill="${C_AXIS}" font-size="10.5" text-anchor="start" font-weight="700">${fmtDateShort(pts[0].date)}</text>
    <text x="${xOf(pts[pts.length-1].t)}" y="${H-9}" fill="${C_AXIS}" font-size="10.5" text-anchor="end" font-weight="700">${fmtDateShort(pts[pts.length-1].date)}</text>`;

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Contact quality over time">
      <defs>
        <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4CAF50" stop-opacity="0.42"></stop>
          <stop offset="1" stop-color="#4CAF50" stop-opacity="0.02"></stop>
        </linearGradient>
        <pattern id="gStripe" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
          <rect width="26" height="52" fill="rgba(31,122,68,0.045)"></rect>
          <rect x="26" width="26" height="52" fill="rgba(76,175,80,0.085)"></rect>
        </pattern>
      </defs>
      ${grid}${markers}
      <path d="${area}" fill="url(#gArea)"></path>
      <path d="${line}" fill="none" stroke="#1F7A44" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"></path>
      ${dots}${xlabels}
    </svg>`;
}

/** Horizontal stacked bars: ball-flight distribution per club group (rounded ends). */
function drawFlightChart(sessions) {
  const el = document.getElementById('chartFlights');

  // group -> flight -> count
  const data = {};
  sessions.forEach(s => (s.clubGroups || []).forEach(cg => {
    flightsOf(cg).forEach(f => {
      data[cg.group] = data[cg.group] || {};
      data[cg.group][f] = (data[cg.group][f] || 0) + 1;
    });
  }));

  const groups = CLUB_GROUPS.filter(g => data[g]);
  if (!groups.length) {
    el.innerHTML = `<p class="muted">No ball-flight data logged yet.</p>`;
    return;
  }
  // Flights actually present, ordered by the current options (extras appended).
  const present = [...new Set(groups.flatMap(g => Object.keys(data[g])))];
  const ordered = flightOrder(present).filter(f => present.includes(f));

  const rowH = 30, gap = 18, labelW = 100, barW = 420, padR = 12;
  const W = labelW + barW + padR;
  const H = groups.length * (rowH + gap);

  let clips = '', rows = '';
  groups.forEach((g, i) => {
    const counts = data[g];
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const y = i * (rowH + gap);
    let x = labelW;
    let segs = '';
    clips += `<clipPath id="fc${i}"><rect x="${labelW}" y="${y}" width="${barW}" height="${rowH}" rx="${rowH/2}"></rect></clipPath>`;
    ordered.forEach(f => {
      const c = counts[f]; if (!c) return;
      const w = (c / total) * barW;
      segs += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${rowH}" fill="${flightColor(f)}">
        <title>${g} — ${f}: ${c}</title></rect>`;
      if (w > 26) segs += `<text x="${(x + w/2).toFixed(1)}" y="${y + rowH/2 + 4}" fill="#FBFBF4" font-size="11.5" font-weight="800" text-anchor="middle">${c}</text>`;
      x += w;
    });
    rows += `
      <text x="0" y="${y + rowH/2 + 4}" fill="${C_INK}" font-size="12.5" font-weight="800">${g}</text>
      <g clip-path="url(#fc${i})">${segs}</g>`;
  });

  const legend = ordered.map(f =>
    `<span><span class="sw" style="background:${flightColor(f)}"></span>${esc(f)}</span>`
  ).join('');

  el.innerHTML = `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Ball flight distribution">
        <defs>${clips}</defs>${rows}
      </svg>
    </div>
    <div class="legend">${legend}</div>`;
}

/* ---------------------------------------------------------------------------
   VIEW 5: TERMS — the rulebook / yardage book
   --------------------------------------------------------------------------- */

let termQuery = '';

function renderTerms() {
  const q = termQuery.trim().toLowerCase();
  const matches = TERMS.filter(t =>
    !q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q)
  );

  // Group matches by category, preserving TERM_CATS order.
  let sections = '';
  TERM_CATS.forEach(cat => {
    const items = matches.filter(t => t.cat === cat);
    if (!items.length) return;
    sections += `
      <div class="card">
        <div class="section-label">${cat}</div>
        ${items.map(t => {
          const color = t.color || (cat === 'Ball Flight' ? FLIGHT_COLORS[t.term] : null);
          return `
          <div class="term-row">
            <div class="term-head">
              <span class="term-name" style="${color ? `color:${color}` : ''}">${esc(t.term)}</span>
            </div>
            <div class="term-def">${esc(t.def)}</div>
          </div>`;
        }).join('')}
      </div>`;
  });

  const body = matches.length ? sections
    : emptyState('🔍', 'No matches', `Nothing found for “${esc(termQuery)}”. Try another word.`);

  main.innerHTML = `
    <div class="view">
      <div class="view-head">
        <span class="eyebrow">The Rulebook</span>
        <h2>Terms</h2>
        <div class="sub">Golf shorthand, in plain English.</div>
      </div>
      <div class="card">
        <input type="text" id="termSearch" placeholder="Search terms (e.g. slice, tempo, wedge)" value="${esc(termQuery)}">
      </div>
      ${body}
    </div>`;

  const box = document.getElementById('termSearch');
  box.addEventListener('input', e => {
    termQuery = e.target.value;
    const start = e.target.selectionStart;
    renderTerms();
    // keep focus + caret after re-render
    const nb = document.getElementById('termSearch');
    nb.focus();
    try { nb.setSelectionRange(start, start); } catch (_) {}
  });
}

/* ---------------------------------------------------------------------------
   Shared UI: empty state, toast, modal
   --------------------------------------------------------------------------- */

function emptyState(icon, title, msg, ctaLabel, ctaView) {
  const cta = ctaLabel ? `<button class="btn primary" data-empty-cta>${ctaLabel}</button>` : '';
  return `<div class="empty"><div class="big">${icon}</div><h3>${title}</h3><p>${msg}</p>${cta}</div>`;
}

let toastTimer = null;
/** Toast. Pass ball=true for the putt-drop confirmation. */
function toast(msg, ball) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  if (ball) {
    const b = document.createElement('span');
    b.className = 'ball';
    t.appendChild(b);
  }
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 1900);
}

function openModal(title, bodyHTML, actions) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.id = 'modalBack';
  back.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-actions" id="modalActions"></div>
    </div>`;
  document.body.appendChild(back);

  const actWrap = back.querySelector('#modalActions');
  (actions || []).forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (a.cls || '');
    btn.textContent = a.label;
    btn.addEventListener('click', a.onClick);
    actWrap.appendChild(btn);
  });

  back.querySelector('#modalClose').addEventListener('click', closeModal);
  back.addEventListener('click', e => { if (e.target === back) closeModal(); });
}

function closeModal() {
  const b = document.getElementById('modalBack');
  if (b) b.remove();
}

function confirmModal(title, msg, onConfirm) {
  openModal(title, `<p class="muted">${esc(msg)}</p>`, [
    { label: 'Cancel', cls: 'ghost', onClick: closeModal },
    { label: 'Delete', cls: 'danger', onClick: onConfirm }
  ]);
}

/* ============================================================================
   5. EVENT WIRING / router
   ============================================================================ */

function switchView(view) {
  currentView = view;
  if (view === 'log' && !logDraft) logDraft = newLogDraft();
  render();
}

// Nav buttons (mobile tabs + desktop sidebar)
document.querySelectorAll('#tabnav button, #sidenav button').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

// --- Export ---
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rangelog-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Data exported');
});

// --- Import ---
const importFile = document.getElementById('importFile');
document.getElementById('btnImport').addEventListener('click', () => importFile.click());
importFile.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.lessons) || !Array.isArray(parsed.sessions)) {
        throw new Error('bad shape');
      }
      confirmImport(parsed);
    } catch (err) {
      toast('⚠️ Invalid RangeLog file');
    }
    importFile.value = '';
  };
  reader.readAsText(file);
});

function confirmImport(parsed) {
  openModal('Import data',
    `<p class="muted">This will <strong>replace</strong> your current data with the imported file:</p>
     <div class="stat-grid mt12">
       <div class="stat"><div class="num">${parsed.lessons.length}</div><div class="lbl">Lessons</div></div>
       <div class="stat"><div class="num">${parsed.sessions.length}</div><div class="lbl">Sessions</div></div>
     </div>`,
    [
      { label: 'Cancel', cls: 'ghost', onClick: closeModal },
      { label: 'Replace data', cls: 'primary', onClick: () => {
        const data = normalizeData(parsed);
        mutate({ action: 'replace-all', data }, () => { DATA = data; });
        closeModal();
        render();
        toast('Data imported', true);
      } }
    ]);
}

/* ---------- Settings ---------- */

document.getElementById('btnSettings').addEventListener('click', openSettings);

function openSettings() {
  // Editable copy of the current tendency list.
  let flights = flightOptions().slice();

  const body = `
    <div class="section-label">Ball-flight tendencies</div>
    <p class="muted" style="margin-bottom:12px">These are the buttons you tap when logging a session. Add your own, rename, or trim the list.</p>
    <div id="flightRows"></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px">
      <button class="btn sm ghost" id="addFlight">＋ Add tendency</button>
      <button class="btn sm ghost" id="resetFlights">Reset to default</button>
    </div>`;

  openModal('Settings', body, [
    { label: 'Cancel', cls: 'ghost', onClick: closeModal },
    { label: 'Save', cls: 'primary', onClick: () => saveSettings(flights) }
  ]);

  function drawFlights() {
    const box = document.getElementById('flightRows');
    box.innerHTML = flights.map((f, i) => `
      <div class="drill-row">
        <input type="text" placeholder="Tendency ${i + 1}" data-fi="${i}" value="${esc(f)}" maxlength="40">
        ${flights.length > 1 ? `<button class="rm" data-rm="${i}" aria-label="Remove">×</button>` : ''}
      </div>`).join('');
    box.querySelectorAll('[data-fi]').forEach(inp =>
      inp.addEventListener('input', e => { flights[Number(e.target.dataset.fi)] = e.target.value; }));
    box.querySelectorAll('[data-rm]').forEach(btn =>
      btn.addEventListener('click', () => { flights.splice(Number(btn.dataset.rm), 1); drawFlights(); }));
    document.getElementById('addFlight').classList.toggle('hidden', flights.length >= 20);
  }
  drawFlights();
  document.getElementById('addFlight').addEventListener('click', () => {
    if (flights.length < 20) { flights.push(''); drawFlights(); }
  });
  document.getElementById('resetFlights').addEventListener('click', () => {
    flights = DEFAULT_FLIGHTS.slice(); drawFlights();
  });
}

function saveSettings(flights) {
  const clean = normalizeFlightList(flights);
  if (!clean) { toast('Add at least one tendency'); return; }
  const settings = { flights: clean };
  mutate({ action: 'save-settings', settings }, () => { DATA.settings = settings; });
  closeModal();
  render();
  toast('Settings saved', true);
}

// Close modal on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- Live sync wiring ---------- */

let pollTimer = null;
function startPolling() { stopPolling(); pollTimer = setInterval(pull, POLL_MS); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// Refresh when the tab regains attention; pause polling while hidden.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else { pull(); startPolling(); }
});
window.addEventListener('focus', () => { if (!document.hidden) pull(); });
// Flush queued writes the moment connectivity returns.
window.addEventListener('online', () => { pull(); });
window.addEventListener('offline', () => setSyncStatus('offline'));

/* ---------- Boot ---------- */
// 1) Paint instantly from the local cache (already loaded into DATA).
switchView('log');
// 2) Gate on the password. A stored pass is trusted for boot; if it's actually
//    wrong the first API call returns 401 and re-locks. No stored pass → lock.
if (getPass()) beginSync();
else showLock();
</script>
